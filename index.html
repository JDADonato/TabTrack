<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="tabContent"></div>
    <div id="nameModal" class="modal" style="display: none;">
        <div class="modal-content">
          <span class="close" onclick="toggleModal()">&times;</span>
          <h3>Edit Names</h3>
          <textarea id="bulkNames" placeholder="One name per line..."></textarea>
          <div class="modal-actions">
            <button onclick="saveNames()">Save</button>
            <button onclick="toggleModal()">Cancel</button>
          </div>
        </div>
      </div>
        </div>
  <div id="tabMenu" style="display:none;">
    <button onclick="renameTab()">Rename</button>
    <button onclick="deleteTab()">Delete</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
